# Builds the desktop app (apps/desktop) for Linux, macOS and Windows and automatically publishes the release to
# wengu-app/downloads when triggered on main (unless publish=false). macOS artifacts are Developer ID signed & notarized.
name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish release to wengu-app/downloads (only on main)"
        type: boolean
        default: true
      notes:
        description: "Release notes (optional; defaults to commit summary since previous version)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            script: dist:linux
            files: |
              apps/desktop/dist/*.AppImage
              apps/desktop/dist/*.deb
              apps/desktop/dist/latest*.yml
          - name: macos-arm64-x64
            os: macos-15
            script: dist:mac
            files: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.zip
              apps/desktop/dist/*.blockmap
              apps/desktop/dist/latest*.yml
          - name: windows-x64
            os: windows-2025
            script: dist:win
            files: |
              apps/desktop/dist/*.exe
              apps/desktop/dist/*.blockmap
              apps/desktop/dist/latest*.yml
    env:
      WENGU_UPDATE_URL: ${{ vars.WENGU_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Enable corepack (pnpm version from package.json)
        run: corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile --filter "@wengu/desktop..."

      - name: Test Go MCP proxy
        working-directory: apps/desktop/mcp
        run: go test -v .

      - name: Build and package
        if: runner.os != 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: corepack pnpm --filter @wengu/desktop run ${{ matrix.script }}

      # Signs with Developer ID, then notarizes and staples Wengu.app (App Store Connect API team key) before the
      # dmg and zip are made from it. The .p8 key exists only for the duration of this step.
      - name: Build, sign and notarize macOS
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          : "${CSC_LINK:?Missing MAC_CSC_LINK}"
          : "${CSC_KEY_PASSWORD:?Missing MAC_CSC_KEY_PASSWORD}"
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY_BASE64}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID}"
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER}"
          key="$RUNNER_TEMP/wengu-notary-key.p8"
          trap 'rm -f "$key"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          (umask 077; printf '%s' "$APPLE_API_KEY_BASE64" | tr -d ' \r\n' | base64 --decode > "$key")
          chmod 600 "$key"
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$key" || { echo "APPLE_API_KEY_BASE64 does not decode to a .p8 key"; exit 1; }
          unset APPLE_API_KEY_BASE64
          APPLE_API_KEY="$key" WENGU_NOTARIZE=1 corepack pnpm --filter @wengu/desktop run dist:mac

      - name: Remove notarization key (macOS)
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/wengu-notary-key.p8"

      # A build that packages fine can still be killed at launch by macOS if its code signature is broken.
      - name: Verify signature and launch (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop/dist
        run: |
          for app in mac-arm64/Wengu.app mac/Wengu.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            signature=$(codesign -dv --verbose=4 "$app" 2>&1)
            grep -Fx 'Authority=Developer ID Application: kaixiang li (W3ZB9MVRQ3)' <<< "$signature"
            grep -Fx 'TeamIdentifier=W3ZB9MVRQ3' <<< "$signature"
            mcp="$app/Contents/Resources/wengu-mcp"
            test -x "$mcp"
            codesign --verify --strict --verbose=2 "$mcp"
            mcp_sig=$(codesign -dv --verbose=4 "$mcp" 2>&1)
            grep -Fx 'Authority=Developer ID Application: kaixiang li (W3ZB9MVRQ3)' <<< "$mcp_sig"
            grep -Fx 'TeamIdentifier=W3ZB9MVRQ3' <<< "$mcp_sig"
          done
          lipo -archs mac-arm64/Wengu.app/Contents/Resources/wengu-mcp | grep -Fx 'arm64'
          lipo -archs mac/Wengu.app/Contents/Resources/wengu-mcp | grep -Fx 'x86_64'
          host=mac-arm64; [ "$(uname -m)" = "x86_64" ] && host=mac
          echo "Launch smoke test: $host/Wengu.app on $(uname -m)"
          "$host/Wengu.app/Contents/MacOS/Wengu" --user-data-dir="$RUNNER_TEMP/wengu-smoke" > "$RUNNER_TEMP/wengu-smoke.log" 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            echo "app still running after 20 s"
            kill "$pid"
          else
            wait "$pid" || code=$?
            echo "app exited early with code ${code:-0}"
            cat "$RUNNER_TEMP/wengu-smoke.log"
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -5
            exit 1
          fi

      # With only `wengu-mcp` processes running, opening the app must still start one desktop window.
      - name: Verify opening the app next to MCP processes (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          host=mac-arm64; [ "$(uname -m)" = "x86_64" ] && host=mac
          WENGU_APP_EXECUTABLE="$PWD/dist/$host/Wengu.app/Contents/MacOS/Wengu" corepack pnpm exec playwright test tests/mac-reopen.spec.ts

      # Checks the Wengu.app inside each file that is actually shipped (dmg for download, zip for the updater).
      - name: Verify notarization of distributables (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop/dist
        run: |
          version=$(node -p 'require("../package.json").version')
          check() {
            echo "== $1"
            # called as `check ... ||`, so errexit is off in here: every failure must return explicitly
            xcrun stapler validate "$2" || return 1
            assessment=$(spctl --assess --type execute --verbose=4 "$2" 2>&1) || { echo "$assessment"; return 1; }
            echo "$assessment"
            grep -Fxq 'source=Notarized Developer ID' <<< "$assessment" || return 1
          }
          for arch in arm64 x64; do
            dmg="Wengu-$version-mac-$arch.dmg"
            zip="Wengu-$version-mac-$arch.zip"
            mnt="$RUNNER_TEMP/verify-dmg-$arch"
            hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" "$dmg" > /dev/null
            status=0
            check "$dmg" "$mnt/Wengu.app" || status=$?
            hdiutil detach "$mnt" > /dev/null
            [ "$status" -eq 0 ] || { echo "notarization check failed: $dmg"; exit 1; }
            out="$RUNNER_TEMP/verify-zip-$arch"
            mkdir -p "$out"
            ditto -x -k "$zip" "$out"
            check "$zip" "$out/Wengu.app" || { echo "notarization check failed: $zip"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wengu-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release (wengu-app/downloads)
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && inputs.publish != false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to wengu-app/downloads
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_RELEASE_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Missing DOWNLOADS_RELEASE_TOKEN}"
          version=$(node -p 'require("./apps/desktop/package.json").version')
          tag="v$version"

          if gh release view "$tag" -R wengu-app/downloads >/dev/null 2>&1; then
            echo "Release $tag already exists in wengu-app/downloads; bump apps/desktop/package.json version first."
            exit 1
          fi

          mapfile -t files < <(find release-assets -type f | sort)
          echo "Found ${#files[@]} release assets:"
          printf '  %s\n' "${files[@]}"
          [ "${#files[@]}" -ge 15 ] || { echo "Expected at least 15 assets, got ${#files[@]}"; exit 1; }

          for f in "${files[@]}"; do
            base=$(basename "$f")
            [ "$base" = "${base// /}" ] || { echo "Asset filename contains spaces: $base"; exit 1; }
          done

          for manifest in latest.yml latest-mac.yml latest-linux.yml; do
            mpath=$(find release-assets -type f -name "$manifest" | head -1)
            [ -n "$mpath" ] || { echo "Missing manifest: $manifest"; exit 1; }
            first=$(head -1 "$mpath" | tr -d '\r')
            [ "$first" = "version: $version" ] || { echo "Manifest $manifest has '$first', expected 'version: $version'"; exit 1; }
          done

          notes_file="$RUNNER_TEMP/release-notes.md"
          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          else
            prev_commit=$(git log -n 2 --format=%H -- apps/desktop/package.json | tail -1)
            {
              echo "## 更新内容"
              echo ""
              if [ -n "$prev_commit" ] && [ "$prev_commit" != "$(git rev-parse HEAD)" ]; then
                git log --format='- %s' "${prev_commit}..HEAD"
              else
                git log -n 1 --format='- %s' HEAD
              fi
              echo ""
              echo "已安装 0.1.1 及以后版本的用户会在应用内收到更新。"
            } > "$notes_file"
          fi

          gh release create "$tag" -R wengu-app/downloads \
            --title "温故 $version" \
            --notes-file "$notes_file" \
            --latest \
            "${files[@]}"

          # Verify the public update feed now serves the new version on all three platforms.
          for manifest in latest.yml latest-mac.yml latest-linux.yml; do
            first=$(curl -fsSL "https://github.com/wengu-app/downloads/releases/latest/download/$manifest" | head -1 | tr -d '\r')
            echo "Published $manifest -> $first"
            [ "$first" = "version: $version" ] || { echo "Unexpected published $manifest header: $first"; exit 1; }
          done
