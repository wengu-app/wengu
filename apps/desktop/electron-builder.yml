# electron-builder configuration for Wengu (温故).
# Linux (AppImage, deb) is built and run-tested; macOS (dmg + zip, separate arm64 and x64 builds) and Windows (NSIS)
# build in CI but have not been run on real machines — see README.md.
appId: dev.wengu.app
# ASCII product name for paths (install dir, bundle, executables); 温故 is the display name below.
productName: Wengu
copyright: Copyright © 2026 Wengu contributors
artifactName: Wengu-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  # not "build/": that name is git-ignored repo-wide
  buildResources: resources

# Production updater dependencies are collected by electron-builder.
files:
  - package.json
  - out/main.cjs
  - out/preload.cjs
  - resources/icons/512x512.png
  - from: ../web/dist
    to: web
    filter: ["**/*"]
asar: true
# the packaged package.json is named plainly (artifact, updater-cache and installer-payload names derive from it)
extraMetadata:
  name: wengu
npmRebuild: false

# https://www.electronjs.org/docs/latest/tutorial/fuses
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
  # Flipping fuses rewrites the Electron Framework binary and invalidates its signature; on Apple silicon the app is
  # then killed at launch (CODESIGNING, Invalid Page). Re-sign ad-hoc right after flipping.
  resetAdHocDarwinSignature: true

fileAssociations:
  - ext: apkg
    name: Anki Deck Package
    description: Anki deck package
    mimeType: application/x-apkg
    role: Viewer
    rank: Alternate
  - ext: colpkg
    name: Anki Collection Package
    description: Anki collection package
    mimeType: application/x-colpkg
    role: Viewer
    rank: Alternate

# The package script sets the update feed at build time.
publish:
  - provider: generic
    url: ${env.WENGU_UPDATE_URL}

linux:
  executableName: wengu
  # the window's app_id/WM_CLASS matches wengu.desktop (package.json desktopName)
  syncDesktopName: true
  target: [AppImage, deb]
  icon: resources/icons
  category: Education
  synopsis: Spaced-repetition reviewer, compatible with Anki decks
  description: Wengu (温故) is a local-first learning app. It imports and exports Anki decks (.apkg) with their review history and keeps everything on this device.
  maintainer: Wengu <hello@wengu.dev>
  vendor: Wengu
  desktop:
    entry:
      Name: 温故
      GenericName: Flashcards
      Comment: Spaced repetition, compatible with Anki decks
      Keywords: flashcards;anki;spaced repetition;srs;wengu;

appImage:
  artifactName: Wengu-${version}-${arch}.AppImage

deb:
  packageName: wengu
  artifactName: wengu_${version}_${arch}.${ext}
  priority: optional

mac:
  executableName: Wengu
  category: public.app-category.education
  icon: resources/icon.icns
  target:
    # Apple silicon and Intel are shipped as separate downloads, not a universal build.
    - target: dmg
      arch: [arm64, x64]
    # zip: what electron-updater (Squirrel.Mac) needs for updates
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  # electron-builder's default entitlements (JIT etc. for V8 under the hardened runtime)
  gatekeeperAssess: false
  notarize: false
  extendInfo:
    # Finder / Launchpad show 温故; the bundle on disk stays Wengu.app. Do NOT override CFBundleName: Electron
    # derives the helper app names ("<CFBundleName> Helper.app") from it and aborts at launch if they don't exist.
    CFBundleDisplayName: 温故
    NSHumanReadableCopyright: Copyright © 2026 Wengu contributors

dmg:
  artifactName: Wengu-${version}-mac-${arch}.${ext}

win:
  executableName: Wengu
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: Wengu-Setup-${version}-${arch}.${ext}
  oneClick: true
  perMachine: false
  shortcutName: 温故
  uninstallDisplayName: 温故 Wengu
  deleteAppDataOnUninstall: false
