<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>温故</title>
<style>
@font-face{font-family:"OPPO Sans";font-style:normal;font-weight:100 700;font-display:swap;src:url(fonts/oppo-sans-subset.woff2) format("woff2")}
:root{
  --paper:#f4f2ec; --raise:#ebe8df; --ink:#191814; --ink-2:#4a4740; --ink-3:#8b877c; --ink-4:#c3bfb3;
  --rule:#e0dccf; --hover:rgba(25,24,20,.025); --sel:rgba(25,24,20,.045);
  --accent:#c4421d; --on-accent:#fff; --amber:#b7791f;
  --geo:#3a6bd6; --mcat:#d24877; --jp:#13958e; --la:#7857cf;
  --ease:cubic-bezier(.22,.8,.18,1);
  --sans:"OPPO Sans","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141311; --raise:#1f1d1a; --ink:#ece9e1; --ink-2:#bcb8ad; --ink-3:#85817a; --ink-4:#4b4842;
    --rule:#2a2824; --hover:rgba(236,233,225,.03); --sel:rgba(236,233,225,.05);
    --accent:#e2603a; --on-accent:#fff; --amber:#d9a046;
    --geo:#6d97f0; --mcat:#ec6e98; --jp:#34bcb4; --la:#9c83eb;
  }
}
:root[data-theme="dark"]{
  --paper:#141311; --raise:#1f1d1a; --ink:#ece9e1; --ink-2:#bcb8ad; --ink-3:#85817a; --ink-4:#4b4842;
  --rule:#2a2824; --hover:rgba(236,233,225,.03); --sel:rgba(236,233,225,.05);
  --accent:#e2603a; --on-accent:#fff; --amber:#d9a046;
  --geo:#6d97f0; --mcat:#ec6e98; --jp:#34bcb4; --la:#9c83eb;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"tnum" 1}
html.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.n{font-variant-numeric:tabular-nums}

/* ---------- type primitives ---------- */
.kicker{display:flex;align-items:center;gap:8px;height:16px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.14em;color:var(--ink);white-space:nowrap}
.kicker .m{color:var(--ink-3);letter-spacing:.04em;font-weight:500}
.kicker .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-4)}
.meta{font-size:13px;line-height:20px;color:var(--ink-3)}
.meta b{color:var(--ink);font-weight:600}
.lead{font-size:15px;line-height:24px;color:var(--ink-2);margin:0}
.lead b{color:var(--ink);font-weight:600}
.sw{display:block;width:8px;height:8px;border-radius:2px;flex:none}

/* ---------- top bar ---------- */
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--rule)}
.top-r{display:flex;align-items:center;gap:4px;margin-right:-8px}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:.06em}
.seal{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:15px;font-weight:700;letter-spacing:0}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 10px;border-radius:10px;color:var(--ink-3);font-size:14px;transition:background .15s,color .15s}
.search:hover,.icon-btn:hover{background:var(--raise);color:var(--ink)}
kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;font:600 11px/1 var(--sans);color:var(--ink-3);background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule)}
.search kbd{margin-left:4px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);transition:background .15s,color .15s}
.icon-btn svg{transition:transform .5s var(--ease)}
.icon-btn:hover svg{transform:rotate(60deg)}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr))}
.blk{position:relative;display:flex;flex-direction:column;padding:28px 32px 24px;border-bottom:1px solid var(--rule);cursor:pointer;outline:none;transition:background .2s;min-width:0}
.blk+.blk{border-left:1px solid var(--rule)}
.blk:hover{background:var(--hover)}
.blk:focus-visible{box-shadow:inset 0 0 0 2px var(--ink)}
.bh{display:flex;align-items:center;justify-content:space-between;gap:16px;height:28px;margin:-6px 0 0}
.go{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule);transition:background .2s,color .2s,box-shadow .2s;flex:none}
.blk:hover .go{background:var(--ink);color:var(--paper);box-shadow:none}
.go svg{transition:transform .3s var(--ease)}
.blk:hover .go svg{transform:translate(1px,-1px)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:16px;border-top:1px solid var(--rule);height:20px;box-sizing:content-box}
.act{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.act svg{transition:transform .2s var(--ease)}
.act:hover svg{transform:translateX(2px)}

/* ---------- hero ---------- */
.hero{grid-column:span 12;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);padding:0;height:500px}
.hero:hover{background:none}
.hero .side{display:flex;flex-direction:column;padding:28px 32px 32px;border-right:1px solid var(--rule)}
.hero .side:hover,.hero .map:hover{background:var(--hover)}
.count{display:flex;align-items:baseline;gap:14px;margin-top:40px}
.count .big{font-size:136px;line-height:104px;font-weight:700;letter-spacing:-.065em;margin-left:-6px}
.count .unit{font-size:20px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.mix{display:flex;gap:2px;height:6px;margin-top:28px;border-radius:3px;overflow:hidden}
.mix i{display:block;height:100%;transition:flex-grow .4s var(--ease)}
.mix-l{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;margin-top:14px}
.mix-l div{display:flex;flex-direction:column;gap:2px}
.mix-l .k{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--ink-3)}
.mix-l .k i{width:6px;height:6px;border-radius:1.5px}
.mix-l .v{font-size:20px;line-height:28px;font-weight:650;letter-spacing:-.01em}
.mix-l .v small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:2px}
.hero .lead{margin-top:28px}
.btns{display:flex;gap:10px;margin-top:auto}
.btn{height:48px;padding:0 22px;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-size:15px;font-weight:650;white-space:nowrap;transition:transform .12s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.pri.k{padding-right:14px}
.btn.pri:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.pri kbd{background:rgba(255,255,255,.18);box-shadow:none;color:inherit;height:24px}
.btn.sec{box-shadow:inset 0 0 0 1.5px var(--ink-4)}
.btn.sec:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sm{height:36px;padding:0 16px;border-radius:18px;font-size:14px}
.hero .map{display:flex;flex-direction:column;padding:28px 32px 20px;min-width:0}
.legend{display:flex;align-items:center;gap:18px;margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
.legend span,.legend button{display:flex;align-items:center;gap:6px;transition:opacity .2s}
.legend i{width:12px;height:2px;border-radius:1px}
.legend button.off{opacity:.35}
.plot{position:relative;flex:1;min-height:0;margin-top:20px}
.plot canvas{position:absolute;inset:0;width:100%;height:100%}
.tip{position:absolute;z-index:5;pointer-events:none;min-width:168px;padding:10px 12px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:12px;line-height:18px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;white-space:nowrap}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-size:14px;line-height:20px;font-weight:650;margin-bottom:2px}
.tip .d{opacity:.65}
.tip .tr{display:flex;align-items:center;gap:8px}
.tip .tr .sw{width:6px;height:6px}
.tip .tr em{font-style:normal;margin-left:auto;padding-left:16px;font-variant-numeric:tabular-nums}

/* ---------- row 2 ---------- */
.mod{grid-column:span 4;height:340px}
.colhead{display:flex;justify-content:space-between;margin-top:22px;padding-bottom:8px;font-size:12px;line-height:16px;color:var(--ink-3);border-bottom:1px solid var(--rule)}
.deck{display:grid;grid-template-columns:8px minmax(0,1fr) 64px 32px;align-items:center;column-gap:12px;height:40px;border-bottom:1px solid var(--rule)}
.decks .deck:last-child{border-bottom:0}
.deck .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .nm small{font-size:13px;font-weight:400;color:var(--ink-3);margin-left:8px}
.bar{display:block;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.deck .due{text-align:right;font-size:15px;font-weight:650}
.ret{display:flex;align-items:flex-end;justify-content:space-between;margin-top:20px}
.ret .big{font-size:52px;line-height:44px;font-weight:700;letter-spacing:-.05em}
.ret .big small{font-size:24px;letter-spacing:-.02em;margin-left:1px}
.ret .meta{text-align:right;line-height:18px}
.spark{display:block;width:100%;height:36px;margin-top:14px}
.spark svg{display:block;width:100%;overflow:visible}
.fc-h{display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);font-size:12px;line-height:16px;color:var(--ink-3)}
.fc-h b{color:var(--ink);font-weight:600}
.fc{display:grid;grid-template-columns:repeat(7,1fr);margin-top:12px}
.fc div{display:flex;flex-direction:column;gap:4px}
.fc div+div{padding-left:10px;border-left:1px solid var(--rule)}
.fc span{font-size:11px;line-height:14px;color:var(--ink-3)}
.fc em{font-style:normal;font-size:17px;line-height:22px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fc .hi span{color:var(--accent);font-weight:600}
.fc .hi em{color:var(--ink);font-weight:700}

/* dot heatmap (shared) */
.hm-wrap{margin-top:20px}
.hm-m{position:relative;height:14px;font-size:11px;line-height:14px;color:var(--ink-3)}
.hm-m span{position:absolute;top:0;white-space:nowrap}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:2px;margin-top:6px}
.hm i{display:grid;place-items:center;aspect-ratio:1;position:relative;border-radius:50%}
.hm i::before{content:"";width:calc(var(--k,0) * 100%);height:calc(var(--k,0) * 100%);min-width:3px;min-height:3px;border-radius:50%;background:var(--ink);transition:transform .15s}
.hm i.z::before{background:var(--ink-4);opacity:.7}
.hm i.fut::before{width:3px;height:3px;background:none;box-shadow:inset 0 0 0 1px var(--ink-4);opacity:.6}
.hm i.today::before{width:55%;height:55%;background:none;box-shadow:inset 0 0 0 1.5px var(--accent);opacity:1}
.hm.pick i:not(.fut){cursor:pointer}
.hm.pick i:not(.fut):hover::before{transform:scale(1.18)}
.hm i.sel{box-shadow:0 0 0 1.5px var(--ink)}
.hm-l{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.scale{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-3)}
.scale i{display:block;border-radius:50%;background:var(--ink)}
.scale i:first-child{margin-left:4px}.scale i:last-child{margin-right:4px}

/* ---------- sheet ---------- */
.sheet{position:fixed;z-index:50;display:none;background:var(--paper);overflow:hidden;box-shadow:0 0 0 1px var(--rule),0 40px 80px -30px rgba(0,0,0,.25)}
.sheet.anim{transition:top .46s var(--ease),left .46s var(--ease),width .46s var(--ease),height .46s var(--ease)}
.sheet.ready{box-shadow:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 32px;border-bottom:1px solid var(--rule)}
.sheet-t{display:flex;align-items:baseline;gap:14px;min-width:0;white-space:nowrap}
.sheet-t b{font-size:18px;font-weight:700;letter-spacing:.08em}
.sheet-t span{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 6px 0 14px;margin-right:-6px;border-radius:18px;font-size:14px;font-weight:600;color:var(--ink-2);transition:background .15s,color .15s;flex:none}
.back:hover{background:var(--raise);color:var(--ink)}
.sheet-s{height:calc(100% - 64px);overflow-y:auto;overscroll-behavior:contain}
.sheet-b{opacity:0;transform:translateY(8px);transition:opacity .28s,transform .45s var(--ease)}
.sheet.ready .sheet-b{opacity:1;transform:none}
.lift{visibility:hidden}

 /* ---------- view transitions ---------- */
::view-transition-group(*){animation-duration:.48s;animation-timing-function:cubic-bezier(.22,.8,.18,1)}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-old(vt-frame){animation:vt-out .16s ease-out both}
::view-transition-new(vt-frame){animation:none}
::view-transition-new(vt-body){animation:vt-in .36s .18s cubic-bezier(.22,.8,.18,1) both}
::view-transition-new(vt-back),::view-transition-new(vt-sub){animation:vt-fade .26s .22s both}
html.vt-close::view-transition-group(*){animation-duration:.38s}
html.vt-close::view-transition-old(vt-body),html.vt-close::view-transition-old(vt-back),html.vt-close::view-transition-old(vt-sub){animation:vt-out .12s both}
html.vt-close::view-transition-old(vt-frame){animation:vt-out .14s .24s both}
html.vt-close::view-transition-new(vt-frame){animation:vt-fade .2s .16s both}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-fade{from{opacity:0}}
@keyframes vt-in{from{opacity:0;transform:translateY(12px)}}

/* ---------- page grid ---------- */
.pg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr))}
.c{position:relative;display:flex;flex-direction:column;padding:28px 32px;border-bottom:1px solid var(--rule);min-width:0}
.c.br{border-right:1px solid var(--rule)}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.r2{grid-row:span 2}
.subh{display:flex;justify-content:space-between;align-items:baseline;margin-top:36px;padding-bottom:10px;border-bottom:1px solid var(--rule);font-size:12px;line-height:16px;color:var(--ink-3);letter-spacing:.04em}
.subh b{color:var(--ink);font-weight:600}
.subh button{font-size:12px;color:var(--ink-3)}
.subh button:hover{color:var(--ink)}
.note{margin-top:16px;font-size:13px;line-height:20px;color:var(--ink-3)}
.note b{color:var(--ink);font-weight:600}

/* segmented control */
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--raise);flex:none}
.seg button{height:26px;padding:0 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-3);transition:background .15s,color .15s,box-shadow .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--rule),0 1px 2px rgba(0,0,0,.05)}

/* checkbox rows */
.ck{display:grid;grid-template-columns:16px 8px minmax(0,1fr) auto;align-items:center;column-gap:12px;width:100%;height:44px;border-bottom:1px solid var(--rule);text-align:left}
.ck:last-child{border-bottom:0}
.ck .box{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--ink-4);display:grid;place-items:center;color:var(--paper);transition:background .15s,box-shadow .15s}
.ck .box svg{opacity:0;transition:opacity .15s}
.ck.on .box{background:var(--ink);box-shadow:none}
.ck.on .box svg{opacity:1}
.ck .nm{font-size:15px;font-weight:600;transition:color .15s}
.ck .v{font-size:15px;font-weight:600;text-align:right;transition:color .15s}
.ck:not(.on) .nm,.ck:not(.on) .v{color:var(--ink-4)}
.ck:not(.on) .sw{opacity:.35}
.ck:hover .box{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.ck.on:hover .box{box-shadow:none}

/* radio rows */
.rd{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--rule);text-align:left}
.rd:last-child{border-bottom:0}
.rd .o{width:16px;height:16px;margin-top:2px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-4);transition:box-shadow .2s var(--ease)}
.rd.on .o{box-shadow:inset 0 0 0 5px var(--ink)}
.rd b{display:block;font-size:15px;line-height:20px;font-weight:600}
.rd span{display:block;font-size:13px;line-height:20px;color:var(--ink-3)}
.rd:not(.on) b{color:var(--ink-2)}

/* plain list rows */
.li{display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;column-gap:12px;height:44px;border-bottom:1px solid var(--rule)}
.li:last-child{border-bottom:0}
.li .f{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{font-size:13px;color:var(--ink-3);text-align:right}
.li .r b{font-size:15px;font-weight:650;color:var(--ink)}
.li .r b.hot{color:var(--accent)}
.empty{padding:16px 0;font-size:14px;color:var(--ink-3)}

/* key-value rows */
.kv{display:flex;align-items:center;justify-content:space-between;gap:16px;height:44px;border-bottom:1px solid var(--rule)}
.kv:last-child{border-bottom:0}
.kv .k{font-size:14px;color:var(--ink-2)}
.kv .v{font-size:15px;font-weight:600;text-align:right}
.kv .v small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:3px}

/* table */
.tb{margin:0 -12px}
.tr{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:16px;height:52px;padding:0 12px;border-bottom:1px solid var(--rule);font-size:15px;transition:background .15s}
.tr.th{height:36px;font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.tr.row{cursor:pointer}
.tr.row:hover{background:var(--hover)}
.tr.sel{background:var(--sel);box-shadow:inset 2px 0 0 var(--ink)}
.tr .r{text-align:right}
.tr .nm{display:flex;align-items:center;gap:12px;min-width:0;font-weight:600}
.tr .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .nm .chev{width:16px;height:16px;display:grid;place-items:center;color:var(--ink-3);margin-left:-4px;transition:transform .2s var(--ease)}
.tr.open .chev{transform:rotate(90deg)}
.tr.sub{height:44px;font-size:14px;color:var(--ink-2)}
.tr.sub .nm{font-weight:500;padding-left:36px}
.tr.dim{color:var(--ink-3)}
.tr.dim .sw{opacity:.35}
.tag{display:inline-block;margin-left:8px;padding:2px 6px;border-radius:5px;font-size:11px;line-height:14px;font-weight:600;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule)}
.mat{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden}
.mat i{display:block;height:100%}
.tb-l{display:flex;gap:18px;margin-top:14px;font-size:12px;color:var(--ink-3)}
.tb-l span{display:flex;align-items:center;gap:6px}
.tb-l i{width:10px;height:6px;border-radius:2px;display:block}

/* numbers */
.num-xl{display:flex;align-items:baseline;gap:12px;margin-top:22px}
.num-xl .v{font-size:72px;line-height:60px;font-weight:700;letter-spacing:-.055em;margin-left:-3px}
.num-xl .u{font-size:16px;font-weight:600;color:var(--ink-2)}
.kpi .v{margin-top:20px;font-size:44px;line-height:40px;font-weight:700;letter-spacing:-.045em}
.kpi .v small{font-size:20px;letter-spacing:-.01em;margin-left:2px;font-weight:650}
.kpi .meta{margin-top:10px}
.up{color:var(--jp)!important}
.down{color:var(--accent)!important}

/* charts */
.chart{position:relative;margin-top:20px}
.chart svg{display:block;width:100%;overflow:visible}
.chart svg text{font-family:var(--sans);font-size:11px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:56px minmax(0,1fr) 52px;align-items:center;column-gap:14px;height:40px;border-bottom:1px solid var(--rule);font-size:14px}
.hbar:last-child{border-bottom:0}
.hbar .k{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.hbar .k i{width:6px;height:6px;border-radius:50%}
.hbar .t{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:3px}
.hbar .p{text-align:right;font-weight:600}
.dp{display:grid;grid-template-columns:minmax(0,104px) minmax(0,1fr) 40px;align-items:center;column-gap:16px;height:48px;border-bottom:1px solid var(--rule)}
.dp:last-of-type{border-bottom:0}
.dp .k{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;min-width:0}
.dp .k span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp .t{position:relative;height:16px}
.dp .t::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--rule)}
.dp .t .tg{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--accent)}
.dp .t .d{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;box-shadow:0 0 0 2px var(--paper)}
.dp .p{text-align:right;font-size:15px;font-weight:650}
.dp-ax{position:relative;height:16px;margin:8px 0 0;font-size:11px;color:var(--ink-3)}
.dp-ax span{position:absolute;transform:translateX(-50%)}
.hm-year{margin-top:24px}
.hm-year .in{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:8px}
.sess{display:grid;grid-template-columns:72px 1fr 1fr 1fr;align-items:center;height:44px;border-bottom:1px solid var(--rule);font-size:14px}
.sess:last-child{border-bottom:0}
.sess.th{height:32px;font-size:12px;color:var(--ink-3)}
.sess span:not(:first-child){text-align:right}

.toast{position:fixed;left:50%;bottom:28px;z-index:90;transform:translate(-50%,16px);padding:11px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.board>*{animation:rise .7s var(--ease) both}
.board>:nth-child(2){animation-delay:.06s}.board>:nth-child(3){animation-delay:.12s}.board>:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.board>*{animation:none}}

@media (max-width:1180px){
  .hero{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
  .hero .legend{display:none}
  .s3{grid-column:span 6}
  .s3:nth-child(2n){border-right:0}
}
@media (max-width:960px){
  .hero{grid-template-columns:1fr;height:auto}
  .hero .side{border-right:0;border-bottom:1px solid var(--rule);min-height:460px}
  .hero .map{height:440px}
  .hero .legend{display:flex}
  .mod{grid-column:span 12;height:auto;min-height:340px}
  .blk+.blk{border-left:0}
  .s4,.s6,.s8,.s12{grid-column:span 12}
  .c.br{border-right:0}
  .r2{grid-row:auto}
}
@media (max-width:640px){
  .top,.sheet-h{padding:0 16px}
  .search span,.search kbd{display:none}
  .search{width:36px;padding:0;justify-content:center}
  .blk{padding:24px 16px 20px}
  .hero{padding:0}
  .hero .side{padding:24px 16px;min-height:0}
  .hero .map{padding:24px 16px 16px;height:400px}
  .legend{display:none!important}
  .count{margin-top:36px}
  .count .big{font-size:104px;line-height:80px}
  .btns .btn{flex:1;padding:0 16px}
  .btns{margin-top:32px}
  .mod{min-height:0}
  .foot{margin-top:20px}
  .c{padding:24px 16px}
  .s3{grid-column:span 12;border-right:0!important}
  .sheet-t span{display:none}
  .hide-s{display:none!important}
  .tb .tr{grid-template-columns:minmax(0,1fr) 44px 56px}
  .tb .hs,.tb + .tb-l{display:none}
  .hm-year{overflow-x:auto;margin-right:-16px;padding-bottom:6px}
  .hm-year .in{min-width:860px;padding-right:16px}
}

    history: {
      home: b => Object.assign({ 'vt-title': $('.kicker', b) }, dots(b)),
      page: r => dots(r),
    },
  };
  function vtAttrs(root) { const o = {}; $$('[data-vt]', root).forEach(el => o['vt-' + el.dataset.vt] = el); return o; }
  function dots(root) { const o = {}; $$('.hm i[data-d]', root).forEach(el => { if (!el.classList.contains('fut')) o['vt-d-' + el.dataset.d] = el; }); return o; }
  let named = [];
  const name = (map) => { for (const [n, el] of Object.entries(map)) if (el) { el.style.viewTransitionName = n; named.push(el); } };
  const unname = () => { named.forEach(el => el.style.viewTransitionName = ''); named = []; };
  // pick only names that exist on both sides, so nothing flies in from nowhere
  const both = (a, b) => { const A = {}, B = {}; for (const n in a) if (b[n] && a[n]) { A[n] = a[n]; B[n] = b[n]; } return [A, B]; };
  let dotStyle = null;
  function staggerDots(map) {
    if (dotStyle) dotStyle.remove();
    const keys = Object.keys(map).filter(n => n.startsWith('vt-d-')); if (!keys.length) return;
    const xs = keys.map(n => map[n].getBoundingClientRect().left), lo = Math.min(...xs), hi = Math.max(...xs) || 1;
    dotStyle = document.createElement('style');
    dotStyle.textContent = keys.map((n, i) => `::view-transition-group(${n}){animation-delay:${Math.round((xs[i] - lo) / (hi - lo || 1) * 90)}ms}`).join('');
    document.head.appendChild(dotStyle);
  }

  function mount(mod) {
    const pg = pages[mod];
    $('#sheetT').innerHTML = `<b>${pg.title}</b><span>${pg.sub}</span>`;
    $('#sheetB').innerHTML = pg.html(); $('#sheetS').scrollTop = 0;
    Object.assign(sheet.style, { top: '0', left: '0', width: '100%', height: '100%', display: 'block' });
    sheet.classList.remove('anim'); sheet.classList.add('ready');
    document.documentElement.classList.add('locked');
    cleanup = pg.init($('#sheetB')) || null;
  }
  function unmount() {
    sheet.style.display = 'none'; sheet.classList.remove('ready');
    document.documentElement.classList.remove('locked');
    if (cleanup) cleanup(); cleanup = null; $('#sheetB').innerHTML = '';
  }
  const pageFrame = () => ({ 'vt-frame': sheet, 'vt-title': $('#sheetT b'), 'vt-sub': $('#sheetT span'), 'vt-back': $('#back'), 'vt-body': $('#sheetB') });

  function open(mod, instant) {
    const blk = $(`.blk[data-mod="${mod}"]`); if (cur || busy || !blk) return; cur = blk;
    if (!VT || instant) { mount(mod); blk.classList.add('lift'); return; }
    busy = true;
    const H = shared[mod].home(blk);
    name(Object.assign({ 'vt-frame': blk }, H)); staggerDots(H);
    const t = document.startViewTransition(() => {
      unname(); mount(mod); blk.classList.add('lift');
      const P = Object.assign({ 'vt-title': $('#sheetT b') }, shared[mod].page($('#sheetB'))), keep = {};
      for (const n in H) if (P[n]) keep[n] = P[n];
      name(Object.assign(pageFrame(), keep));
    });
    t.finished.finally(() => { unname(); busy = false; });
  }
  function close() {
    if (!cur || busy) return; const blk = cur, mod = blk.dataset.mod;
    if (!VT) { unmount(); blk.classList.remove('lift'); cur = null; return; }
    busy = true;
    const [H, P] = both(shared[mod].home(blk), Object.assign({ 'vt-title': $('#sheetT b') }, shared[mod].page($('#sheetB'))));
    name(Object.assign(pageFrame(), P)); staggerDots(P);
    document.documentElement.classList.add('vt-close');
    const t = document.startViewTransition(() => {
      unname(); unmount(); blk.classList.remove('lift');
      name(Object.assign({ 'vt-frame': blk }, H));
    });
    t.finished.finally(() => { unname(); document.documentElement.classList.remove('vt-close'); cur = null; busy = false; });
  }
  const go = mod => { if (cur || busy) return; history.pushState({ mod }, '', '#' + mod); open(mod); };
  const back = () => { if (history.state && history.state.mod) history.back(); else { history.replaceState(null, '', location.pathname); close(); } };
  addEventListener('popstate', () => { const m = location.hash.slice(1); if (pages[m]) open(m); else close(); });
  $$('.blk').forEach(b => {
    b.addEventListener('click', e => { if (!e.target.closest('button')) go(b.dataset.mod); });
    b.addEventListener('keydown', e => { if (e.target === b && e.key === 'Enter') go(b.dataset.mod); });
  });
  $('#back').onclick = back;
  addEventListener('keydown', e => { if (e.key === 'Escape' && cur) back(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => homeMap.redraw());
  const m0 = window.__open || location.hash.slice(1); if (pages[m0]) open(m0, true);
})();
</script>
</body>
