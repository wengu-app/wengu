<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>温故 · 游戏风原型</title>
<style>
@font-face{font-family:"OPPO Sans";font-style:normal;font-weight:100 700;font-display:swap;src:url(fonts/oppo-sans-subset.woff2) format("woff2")}
:root{
  --bg:#f7f5ef; --surf:#ffffff; --sunk:#f0ede5; --line:#e7e2d6; --line-d:#d6d0c1;
  --ink:#24221d; --ink-2:#5b5850; --ink-3:#958f83; --ink-4:#c9c3b5;
  --pri:#f26a3d; --pri-d:#cf4f25; --pri-l:#feeee7;
  --new:#3d8bf0; --new-d:#2a6cc6; --new-l:#e8f1fe;
  --lrn:#ec4d5e; --lrn-d:#c43345; --lrn-l:#fdecee;
  --rev:#1fae7a; --rev-d:#138a5f; --rev-l:#e3f6ee;
  --hard:#f1a62a; --hard-d:#c98410; --hard-l:#fef4e2;
  --gold:#f7b500; --gold-d:#d38f00;
  --geo:#3a6bd6; --geo-d:#2b51a8; --mcat:#d24877; --mcat-d:#a8335c; --jp:#13958e; --jp-d:#0c736d; --la:#7857cf; --la-d:#5a3ea8; --his:#a08a6a; --his-d:#7d6a4f;
  --off:#e8e4d9; --off-d:#d3cdbf;
  --shadow:0 1px 0 rgba(0,0,0,.02);
  --sans:"OPPO Sans","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,.8,.18,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141412; --surf:#1e1d1a; --sunk:#191816; --line:#2c2a26; --line-d:#3a3732;
    --ink:#efece4; --ink-2:#bdb9ae; --ink-3:#85817a; --ink-4:#4b4842;
    --pri-l:#3a2219; --new-l:#1b2a40; --lrn-l:#3a1d22; --rev-l:#16302a; --hard-l:#36291a;
    --off:#2d2b27; --off-d:#22211e;
  }
}
:root[data-theme="dark"]{
  --bg:#141412; --surf:#1e1d1a; --sunk:#191816; --line:#2c2a26; --line-d:#3a3732;
  --ink:#efece4; --ink-2:#bdb9ae; --ink-3:#85817a; --ink-4:#4b4842;
  --pri-l:#3a2219; --new-l:#1b2a40; --lrn-l:#3a1d22; --rev-l:#16302a; --hard-l:#36291a;
  --off:#2d2b27; --off-d:#22211e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
svg{display:block;flex-shrink:0}
.view{display:none}
.view.on{display:block}
kbd{font:inherit;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 5px;display:inline-grid;place-items:center;border-radius:6px;border:1.5px solid var(--line-d);border-bottom-width:3px;color:var(--ink-3);line-height:1}

/* chunky */
.btn{--c:var(--pri);--d:var(--pri-d);--t:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:14px;background:var(--c);color:var(--t);font-size:15px;font-weight:700;letter-spacing:.04em;box-shadow:0 4px 0 var(--d);transition:transform .07s,box-shadow .07s,filter .15s;user-select:none;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn:active,.btn.press{transform:translateY(4px);box-shadow:0 0 0 var(--d)}
.btn.lg{height:56px;font-size:17px;border-radius:16px;padding:0 26px}
.btn.ghost{--c:var(--surf);--d:var(--line-d);--t:var(--ink-2);box-shadow:0 0 0 2px var(--line-d) inset,0 4px 0 var(--line-d)}
.btn.ghost:active{box-shadow:0 0 0 2px var(--line-d) inset}
.btn kbd{border-color:rgba(255,255,255,.45);color:inherit;opacity:.9}
.btn.ghost kbd{border-color:var(--line-d);color:var(--ink-3)}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3)}
.ibtn:hover{background:var(--sunk);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:8px;font-size:14px;font-weight:700;background:var(--l);color:var(--c)}
.pill.n{--c:var(--new);--l:var(--new-l)} .pill.l{--c:var(--lrn);--l:var(--lrn-l)} .pill.r{--c:var(--rev);--l:var(--rev-l)}
.pill.z{--c:var(--ink-4);--l:var(--sunk)}

/* ============ top bar ============ */
.top{position:sticky;top:0;z-index:20;height:68px;display:flex;align-items:center;gap:16px;padding:0 32px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:.08em;width:220px}
.brand .mk{width:34px;height:34px;border-radius:11px;background:var(--pri);box-shadow:0 3px 0 var(--pri-d);display:grid;place-items:center;color:#fff;font-size:17px;letter-spacing:0}
.search{flex:1;max-width:560px;margin:0 auto;height:44px;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;border-radius:14px;background:var(--surf);box-shadow:0 0 0 2px var(--line) inset;color:var(--ink-3);font-size:15px;cursor:text}
.search:hover{box-shadow:0 0 0 2px var(--line-d) inset}
.search span{flex:1;text-align:left}
.top .right{display:flex;align-items:center;gap:8px;width:220px;justify-content:flex-end}

/* ============ home ============ */
.wrap{max-width:1240px;margin:0 auto;padding:8px 32px 64px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.blk{background:var(--surf);border-radius:24px;box-shadow:0 0 0 2px var(--line) inset;padding:24px;position:relative}
.blk-h{display:flex;align-items:center;justify-content:space-between;height:28px;margin-bottom:16px}
.blk-h h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.blk-h h2 small{font-size:14px;font-weight:600;color:var(--ink-3)}
.blk-h .more{font-size:14px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:10px}
.blk-h .more:hover{background:var(--sunk);color:var(--ink)}

.hero{grid-column:span 7;display:grid;grid-template-columns:1fr 196px;gap:8px 24px;padding:28px 28px 28px 32px;overflow:hidden}
.hero .k{font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--ink-3)}
.hero .num{display:flex;align-items:baseline;gap:12px;margin-top:6px}
.hero .num b{font-size:80px;line-height:84px;font-weight:700;letter-spacing:-.02em}
.hero .num span{font-size:18px;font-weight:600;color:var(--ink-2)}
.hero .pills{display:flex;gap:8px;margin-top:10px}
.hero .pills .pill{height:30px;font-size:15px;padding:0 11px}
.hero .pills .pill em{font-style:normal;font-weight:600;opacity:.8;font-size:13px}
.hero .acts{display:flex;gap:12px;margin-top:28px;align-items:center}
.hero .note{font-size:13px;color:var(--ink-3);margin-top:16px;display:flex;align-items:center;gap:6px}
.deckmix{display:flex;flex-direction:column;justify-content:center}
.deckmix .k{margin-bottom:-2px}
.deckmix .row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:14px;font-weight:600;color:var(--ink-2)}
.deckmix .row b{font-weight:700;color:var(--ink)}
.deckmix .row .tr{grid-column:1/-1;height:10px;border-radius:5px;background:var(--off);overflow:hidden}
.deckmix .row .tr i{display:block;height:100%;border-radius:5px}

.rec{grid-column:span 5}
.rec .big{display:flex;gap:28px;margin-bottom:18px}
.rec .big div{display:flex;flex-direction:column}
.rec .big b{font-size:32px;line-height:36px;font-weight:700}
.rec .big b small{font-size:16px;font-weight:600;color:var(--ink-3);margin-left:2px}
.rec .big span{font-size:13px;color:var(--ink-3);font-weight:600;margin-top:2px}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:4px;justify-content:space-between}
.heat i{border-radius:4px;background:var(--off)}
.heat i.t{outline:2px solid var(--ink);outline-offset:1px}
.heat-l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:10px;font-weight:600}
.heat-l span{display:flex;align-items:center;gap:4px}
.heat-l span i{width:11px;height:11px;border-radius:3px;display:block}

.decks{grid-column:span 12}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.tile{--c:var(--geo);--d:var(--geo-d);text-align:left;border-radius:20px;background:var(--surf);box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;transition:transform .07s,box-shadow .07s;position:relative;min-height:188px}
.tile:hover{box-shadow:0 0 0 2px var(--c) inset,0 4px 0 var(--d)}
.tile:active{transform:translateY(4px);box-shadow:0 0 0 2px var(--c) inset,0 0 0 var(--d)}
.tile .hd{display:flex;align-items:center;gap:12px}
.tile .ic{width:44px;height:44px;border-radius:14px;background:var(--c);box-shadow:0 3px 0 var(--d);display:grid;place-items:center;color:#fff;font-size:18px;font-weight:700}
.tile .nm{font-size:17px;font-weight:700;line-height:22px}
.tile .meta{font-size:13px;color:var(--ink-3);font-weight:600}
.tile .cnt{display:flex;gap:6px}
.tile .mast{margin-top:auto}
.mbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surf)}
.mbar i{display:block;height:100%}
.tile .ml{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);font-weight:600;margin-top:7px}
.tile .ml b{color:var(--ink-2)}
.tile .go{position:absolute;right:16px;top:18px;width:40px;height:40px;border-radius:12px;background:var(--c);box-shadow:0 3px 0 var(--d);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity .12s,transform .15s var(--spring)}
.tile:hover .go,.tile:focus-visible .go{opacity:1;transform:none}
.tile.done .cnt{display:none}
.tile.paused{--c:var(--his);--d:var(--his-d)}
.tile.paused .ic{filter:saturate(.4)}
.tile.add{box-shadow:none;border:2px dashed var(--line-d);align-items:center;justify-content:center;color:var(--ink-3);font-weight:700;gap:10px}
.tile.add:hover{border-color:var(--ink-3);color:var(--ink);box-shadow:none}
.tile.add:active{transform:none}
.tile.add .pl{width:48px;height:48px;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.tile.add small{font-weight:600;font-size:13px}
.subs{display:flex;flex-direction:column;gap:2px;margin-top:-4px}
.subs div{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);padding:0 4px;height:22px;align-items:center;border-left:2px solid var(--line);padding-left:10px;margin-left:21px}
.subs div b{font-weight:700}

.fc{grid-column:span 7}
.fc .bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:20px}
.fc .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;position:relative}
.fc .bar .st{width:100%;display:flex;flex-direction:column;gap:2px;border-radius:7px;overflow:hidden}
.fc .bar .st i{display:block}
.fc .bar b{position:absolute;top:0;font-size:12px;font-weight:700;color:var(--ink-2);opacity:0;transition:opacity .1s}
.fc .bar:hover b,.fc .bar.today b{opacity:1}
.fc .xl{display:flex;gap:6px;margin-top:8px}
.fc .xl span{flex:1;text-align:center;font-size:12px;color:var(--ink-3);font-weight:600}
.fc .xl span.t{color:var(--ink)}
.mem{grid-column:span 5;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mem .m{border-radius:18px;background:var(--sunk);padding:16px 18px}
.mem .m .l{font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.06em}
.mem .m .v{font-size:30px;font-weight:700;margin-top:6px;line-height:34px}
.mem .m .v small{font-size:15px;color:var(--ink-3);margin-left:2px}
.mem .m .d{font-size:13px;color:var(--ink-2);margin-top:4px}
.mem .m .d b{color:var(--rev)}
.mem .m.hot .v{color:var(--lrn)}
.mem .blk-h{grid-column:1/-1;margin-bottom:0}

/* ============ review ============ */
.rv{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;grid-template-rows:68px 1fr auto;grid-template-columns:1fr auto}
.rv.on{display:grid}
.rv-top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 24px}
.rv-top .homeb{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 8px;border-radius:12px;font-weight:700;color:var(--ink-2)}
.rv-top .homeb:hover{background:var(--sunk)}
.rv-top .deck{font-weight:700;display:flex;align-items:center;gap:8px}
.rv-top .deck i{width:10px;height:10px;border-radius:4px}
.prog{flex:1;max-width:480px;height:16px;border-radius:8px;background:var(--off);position:relative;overflow:hidden;margin:0 auto}
.prog i{position:absolute;inset:0 auto 0 0;width:0;border-radius:8px;background:var(--rev);transition:width .3s var(--ease)}
.prog i::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.qcnt{display:flex;gap:6px}
.qcnt .pill{transition:transform .2s var(--spring)}
.qcnt .pill.cur{box-shadow:0 0 0 2px var(--c) inset}
.qcnt .pill.bump{transform:scale(1.15)}
.rv-tools{display:flex;gap:2px}

.stage{overflow:auto;display:flex;justify-content:center;padding:24px 32px}
.qcard{width:100%;max-width:760px;align-self:flex-start;margin-top:4vh}
.qcard.in{animation:cardin .2s var(--ease)}
@keyframes cardin{from{opacity:0;transform:translateY(10px)}}
.paper{background:var(--surf);border-radius:28px;box-shadow:0 0 0 2px var(--line) inset,0 6px 0 var(--line);padding:40px 48px 44px;min-height:340px;position:relative}
.paper .tags{display:flex;gap:8px;margin-bottom:28px}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.front{font-size:34px;line-height:1.4;font-weight:700;text-align:center;letter-spacing:.01em}
.front ruby rt{font-size:14px;font-weight:600;color:var(--ink-3)}
.hint{font-size:15px;color:var(--ink-3);margin-top:8px;text-align:center}
.cloze{display:inline-block;min-width:96px;padding:0 10px;border-radius:10px;background:var(--new-l);color:var(--new)}
.cloze.on{background:var(--rev-l);color:var(--rev)}
.back{display:none;margin-top:32px;padding-top:28px;border-top:2px dashed var(--line-d);text-align:center}
.back.on{display:block;animation:rise .18s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.back .a{font-size:30px;line-height:1.4;font-weight:700;color:var(--rev)}
.back .x{font-size:16px;line-height:1.7;color:var(--ink-2);margin-top:10px}
.flag{position:absolute;right:20px;top:20px;width:32px;height:32px;border-radius:10px;display:none;place-items:center;color:var(--lrn);background:var(--lrn-l)}
.flag.on{display:grid}

.side{grid-row:2/4;grid-column:2;width:340px;border-left:2px solid var(--line);background:var(--surf);overflow:auto;padding:20px 24px 24px;display:flex;flex-direction:column;gap:20px;transition:margin .2s var(--ease)}
.rv.noside .side{display:none}
.side h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center}
.gauge{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.gauge .g{position:relative;width:96px;height:96px}
.gauge .g b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.gauge .g b small{font-size:13px;margin-left:1px;margin-top:6px}
.gauge .t{font-size:14px;line-height:1.6;color:var(--ink-2)}
.gauge .t b{color:var(--ink)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{background:var(--sunk);border-radius:14px;padding:10px 12px}
.facts span{display:block;font-size:12px;font-weight:700;color:var(--ink-3)}
.facts b{display:block;font-size:18px;font-weight:700;margin-top:2px}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.why{font-size:14px;line-height:1.7;color:var(--ink-2);background:var(--sunk);border-radius:14px;padding:12px 14px}
.why b{color:var(--ink)}
.curve{width:100%;height:84px}

.dock{grid-column:1;padding:16px 32px 24px;display:flex;justify-content:center}
.dock-in{width:100%;max-width:760px}
.showb{width:100%}
.grades{display:none;grid-template-columns:repeat(4,1fr);gap:12px}
.grades.on{display:grid}
.showb.off{display:none}
.grades .btn{height:68px;flex-direction:column;gap:3px;padding:0;position:relative}
.grades .btn small{font-size:13px;font-weight:600;opacity:.88;letter-spacing:0}
.grades .btn kbd{position:absolute;left:10px;top:10px;min-width:18px;height:18px;font-size:10px}
.g1{--c:var(--lrn);--d:var(--lrn-d)} .g2{--c:var(--hard);--d:var(--hard-d)} .g3{--c:var(--rev);--d:var(--rev-d)} .g4{--c:var(--new);--d:var(--new-d)}
.toast{position:fixed;left:50%;top:80px;transform:translate(-50%,-8px);opacity:0;z-index:60;height:40px;padding:0 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;pointer-events:none;transition:opacity .15s,transform .2s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* finish */
.fin{grid-column:1/-1;grid-row:2/4;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 32px 48px}
.rv.finished .fin{display:flex}
.rv.finished .stage,.rv.finished .dock,.rv.finished .side,.rv.finished .prog,.rv.finished .qcnt,.rv.finished .rv-tools{display:none}
.fin-in{width:100%;max-width:880px;display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start;margin-top:3vh}
.fin .trophy{grid-row:span 2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:32px 24px}
.fin .trophy svg{animation:pop .6s var(--spring) both}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}}
.fin h1{margin:16px 0 4px;font-size:24px;color:var(--gold-d)}
.fin .trophy p{margin:0;color:var(--ink-2);font-size:15px}
.fin .trophy .btn{margin-top:28px;width:100%}
.fin .trophy .btn+.btn{margin-top:12px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.st{border-radius:18px;overflow:hidden;background:var(--c);animation:rise .35s var(--ease) both}
.st:nth-child(2){animation-delay:.06s}.st:nth-child(3){animation-delay:.12s}
.st .h{font-size:12px;font-weight:700;letter-spacing:.12em;color:#fff;text-align:center;padding:6px 0 5px}
.st .v{margin:0 2px 2px;background:var(--surf);border-radius:16px;height:72px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--c)}
.gl{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;height:46px;border-bottom:2px solid var(--line);font-size:15px}
.gl:last-child{border-bottom:0}
.gl i{width:10px;height:10px;border-radius:4px}
.gl .f{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .s{font-size:14px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.gl .s b{color:var(--rev)}
.gl .s b.bad{color:var(--lrn)}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* ============ browse ============ */
.br{display:grid;grid-template-columns:220px 1fr 380px;gap:20px;max-width:1440px;margin:0 auto;padding:8px 32px 32px;height:calc(100vh - 68px)}

  <div class="menu" id="menu">
    <h3>设置</h3>
    <div class="row">目标记住率<span style="display:flex;align-items:center;gap:10px"><input type="range" min="80" max="97" step="1" id="drIn"><b id="drOut">90%</b></span></div>
    <div class="row">每个卡组每天新卡<span class="step"><button id="npMinus">−</button><b id="npOut" style="min-width:32px;text-align:center">5</b><button id="npPlus">+</button></span></div>
    <div class="note">目标记住率越高，间隔越短、复习越多。排期用的是温故应用里与 Anki 对照过的 FSRS 实现。</div>
    <div class="sep"></div>
    <button class="btn ghost" id="reset">重置演示数据</button>
    <div class="note">数据只存在这个浏览器里。</div>
  </div>
</header>

<!-- ================= HOME ================= -->
<main class="view wrap" id="home">
  <div class="grid">
    <section class="blk hero" id="hero">
      <div>
        <div class="k" id="heroK">今天要复习</div>
        <div class="num"><b id="totalDue">0</b><span id="heroSub"></span></div>
        <div class="pills" id="heroPills"></div>
        <div class="acts" id="heroActs"></div>
        <div class="note" id="heroNote"></div>
      </div>
      <div class="deckmix" id="deckmix"></div>
    </section>

    <section class="blk rec">
      <div class="blk-h"><h2>复习记录</h2></div>
      <div class="big" id="recBig"></div>
      <div class="heat" id="heat"></div>
      <div class="heat-l"><span>26 周前</span><span>少 <i style="background:var(--off)"></i><i style="background:color-mix(in srgb,var(--pri) 30%,var(--off))"></i><i style="background:color-mix(in srgb,var(--pri) 60%,var(--off))"></i><i style="background:var(--pri)"></i> 多</span></div>
    </section>

    <section class="blk decks">
      <div class="blk-h" style="margin-bottom:0"><h2>卡组 <small id="deckSum"></small><span style="display:flex;gap:6px;margin-left:8px"><span class="pill n" style="height:24px;font-size:12px">新卡</span><span class="pill l" style="height:24px;font-size:12px">学习中</span><span class="pill r" style="height:24px;font-size:12px">到期</span></span></h2><button class="more" id="newDeckT"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新建卡组</button></div>
      <div class="tiles" id="tiles"></div>
    </section>

    <section class="blk fc">
      <div class="blk-h"><h2>未来两周 <small>每天到期的卡</small></h2></div>
      <div class="bars" id="fcBars"></div>
      <div class="xl" id="fcX"></div>
    </section>

    <section class="blk mem" id="mem"></section>
  </div>
</main>

<!-- ================= BROWSE ================= -->
<main class="view" id="browse">
  <div class="br">
    <div class="col fl" id="filters"></div>
    <div class="col">
      <div class="qbar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span class="qc" id="qChip">全部卡片</span><input id="q" placeholder="搜索正面、背面或标签"><kbd>Esc</kbd></div>
      <table class="tbl"><thead><tr><th>正面</th><th>卡组</th><th>到期</th><th>间隔</th><th>记住概率</th><th>遗忘</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
    <div class="col"><div class="ed" id="ed"></div></div>
  </div>
</main>

<!-- ================= REVIEW ================= -->
<div class="rv" id="rv">
  <div class="rv-top">
    <button class="homeb" data-exit><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>主页 <kbd>Esc</kbd></button>
    <span class="deck" id="rvDeck"></span>
    <div class="prog"><i id="prog"></i></div>
    <div class="qcnt"><span class="pill n" id="cN" title="新卡">0</span><span class="pill l" id="cL" title="学习中">0</span><span class="pill r" id="cR" title="到期">0</span></div>
    <div class="rv-tools">
      <button class="ibtn" title="撤销（Z）" id="undo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="ibtn" title="编辑（E）" id="edit"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></button>
      <button class="ibtn" title="标记（F）" id="flagB"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg></button>
      <button class="ibtn" title="今天跳过（-）" id="bury"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h8"/><circle cx="12" cy="12" r="9"/></svg></button>
      <button class="ibtn" title="卡片信息（I）" id="sideB"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button>
    </div>
  </div>
  <div class="stage">
    <div class="qcard" id="qcard">
      <div class="paper">
        <span class="flag" id="flag"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M5 21V4h11l-2 4 2 4H5z"/></svg></span>
        <div class="tags" id="tags"></div>
        <div class="front" id="front"></div>
        <div class="hint" id="hint"></div>
        <div class="back" id="back"><div class="a" id="ans"></div><div class="x" id="extra"></div></div>
      </div>
    </div>
  </div>
  <aside class="side" id="side"></aside>
  <div class="dock"><div class="dock-in">
    <button class="btn lg showb" id="showBtn" style="--c:var(--ink);--d:#000;--t:var(--bg)">显示答案 <kbd>空格</kbd></button>
    <div class="grades" id="grades">
      <button class="btn g1" data-g="1"><kbd>1</kbd>重来<small id="i1"></small></button>
      <button class="btn g2" data-g="2"><kbd>2</kbd>困难<small id="i2"></small></button>
      <button class="btn g3" data-g="3"><kbd>3</kbd>良好<small id="i3"></small></button>
      <button class="btn g4" data-g="4"><kbd>4</kbd>简单<small id="i4"></small></button>
    </div>
  </div></div>
  <div class="fin"><div class="fin-in">
    <div class="blk trophy">
      <svg width="132" height="132" viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="66" fill="var(--gold)" opacity=".14"/><path d="M44 30h52v22c0 15-11.6 27-26 27S44 67 44 52z" fill="var(--gold)"/><path d="M44 30h52v8H44z" fill="var(--gold-d)" opacity=".35"/><path d="M44 38H32v6c0 9 6 15 14 16M96 38h12v6c0 9-6 15-14 16" fill="none" stroke="var(--gold-d)" stroke-width="7" stroke-linecap="round"/><path d="M62 78h16v14H62z" fill="var(--gold-d)"/><rect x="48" y="92" width="44" height="14" rx="5" fill="var(--gold)"/><path d="m70 40 4.3 8.7 9.6 1.4-7 6.8 1.7 9.5-8.6-4.5-8.6 4.5 1.7-9.5-7-6.8 9.6-1.4z" fill="#fff"/></svg>
      <h1 id="finH">这一轮复习完了</h1>
      <p id="finLead"></p>
      <button class="btn" data-exit>回到主页</button>
      <button class="btn ghost" id="more">再学 10 张新卡</button>
    </div>
    <div class="stats3">
      <div class="st" style="--c:var(--rev)"><div class="h">记住率</div><div class="v" id="fAcc">—</div></div>
      <div class="st" style="--c:var(--new)"><div class="h">用时</div><div class="v" id="fTime">0:00</div></div>
      <div class="st" style="--c:var(--pri)"><div class="h">明天到期</div><div class="v" id="fTom">0</div></div>
    </div>
    <div class="blk" style="padding:16px 24px 6px">
      <div class="blk-h" style="margin-bottom:4px"><h2>这一轮的变化 <small>下次复习：之前 → 现在</small></h2></div>
      <div id="gains"></div>
    </div>
  </div></div>
</div>

<!-- ================= ADD / EDIT ================= -->
<div class="scrim" id="scrim">
  <div class="modal" role="dialog" aria-label="添加卡片">
    <div class="hd"><h2 id="mTitle">添加卡片</h2><button class="ibtn" data-close><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="opts" id="mOpts">
      <div class="seg" id="ntype"><button class="on" data-t="basic">问答</button><button data-t="rev">问答 + 反向</button><button data-t="cloze">填空</button></div>
      <select class="dsel" id="mDeck"></select>
    </div>
    <div class="fld newdeck" id="newDeck"><label>新卡组名称</label><input class="in" id="newDeckName" placeholder="比如：英语词汇"></div>
    <div class="fld"><label id="lFront">正面</label><div class="in" contenteditable="true" id="fFront" data-ph="问题"></div></div>
    <div class="fld"><label id="lBack">背面</label><div class="in" contenteditable="true" id="fBack" data-ph="答案"></div></div>
    <div class="fld"><label>标签（用空格分开）</label><input class="in" id="fTags" placeholder="可不填"></div>
    <div class="ft"><span class="s" id="mHint">保留卡组和标签，可以连续添加</span><button class="btn ghost" data-close>关闭</button><button class="btn" id="addOk">添加 <kbd>Ctrl Enter</kbd></button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="scheduler.js"></script>
<script src="app.js"></script>
</body>
</html>
